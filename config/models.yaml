# Template, not a runnable config: each `id` is sent verbatim as the request
# `model` (there is no alias indirection). Adapt every `id` to a model the
# target LiteLLM proxy actually serves, and set each
# `expected_response_model_prefixes` entry to the prefix that deployment
# returns for that model.
models:
  - id: council-view-a
    family: openai
    expected_response_model_prefixes: ["gpt-view-a-2026"]
    supports: {temperature: true, top_p: true, reasoning_effort: false, json_schema: true, json_object: true}
  - id: council-view-b
    family: anthropic
    expected_response_model_prefixes: ["claude-view-b-2026"]
    supports: {temperature: true, top_p: true, reasoning_effort: false, json_schema: true, json_object: true}
  - id: council-view-c
    family: google
    expected_response_model_prefixes: ["gemini-view-c-2026"]
    supports: {temperature: true, top_p: true, reasoning_effort: false, json_schema: true, json_object: true}
  - id: council-judge-a
    family: openai
    expected_response_model_prefixes: ["gpt-judge-a-2026"]
    supports: {temperature: true, top_p: true, reasoning_effort: true, json_schema: true, json_object: true}
