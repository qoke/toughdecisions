key: CTRL02
name: "Control sentinel: choosing a school-term work pattern (selection twin)"
split: selection
tags: [control, sentinel]
seats_relevant: [possibility, perspective, stress_tester, judge]
acceptance:
  must_notice:
    - "The couple must cover school pickup at 15:30 on weekdays, which bounds work hours."
    - "The shared budget cap is 400 per month for after-school cover."
  cannot_assume:
    - "Do not assume either employer allows schedule changes without asking."
    - "Do not assume grandparents are available; they visit monthly."
  material_errors:
    - "Recommending a pattern that leaves pickup uncovered."
    - "Spending above the 400 cap without flagging it."
  variant_expectations: "Base case only; the recommendation must cover pickup and stay within budget."
planted_issues:
  - id: CTRL02-I1
    text: "School pickup is at 15:30 every weekday and must be covered by an adult."
    kind: constraint
  - id: CTRL02-I2
    text: "The monthly budget cap for after-school cover is 400."
    kind: fact
cases:
  - key: CTRL02-base
    variant: base
    card:
      decision: "Which work pattern to choose for the autumn school term."
      context: "Two parents share pickup at 15:30 on weekdays. Grandparents visit monthly, not weekly."
      priorities: "Cover every pickup; stay within the 400 monthly cap."
      unusual: "The younger child will not stay with unfamiliar sitters."
      history: "Last term a late-pickup fee was paid twice."
      deadline: "Employers need the pattern by 2026-09-25."
      style: "Practical, kind, specific."
    messages:
      - sender: them
        text: "The school confirmed 15:30 pickup again. Mum and Dad visit monthly, so it is on us."
        ts: "2026-09-05T17:00:00Z"
      - sender: me
        text: "We have 400 a month for cover. Can we shape our hours to fit?"
        ts: "2026-09-05T17:15:00Z"
    question: "What work pattern covers pickup every day and stays within budget?"
